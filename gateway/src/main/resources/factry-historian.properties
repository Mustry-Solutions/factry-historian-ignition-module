# Factry Historian Module - operational settings
# These values are bundled in the module and not exposed in the Ignition UI.

# gRPC write deadline in seconds (createPoints timeout)
grpc.write.deadline.seconds=3

# Connection status cache duration in milliseconds
# Controls how often the gateway polls the gRPC connection for status
status.cache.ms=30000

# Measurement cache refresh interval in seconds
# Periodically syncs the local measurement cache with Factry to detect
# deleted measurements and allow re-creation on the next store
measurement.cache.refresh.seconds=30

# Page size for fetching measurements from Factry during cache refresh
# Larger values reduce the number of gRPC round-trips but increase per-request payload
measurement.cache.page.size=5000

# Most raw points one query reads from Factry, over all its pens together
# Raw reads page through Factry, so a long range over many pens has no other bound
# (each point costs roughly 100 bytes of gateway heap). When a query reaches this,
# it stops paging, returns the points read so far and logs a warning.
# 1,000,000 covers a day of 1-second data for 11 pens.
query.raw.max.points=1000000
