# Factry Historian Module - operational settings
# These values are bundled in the module and not exposed in the Ignition UI.

# gRPC write deadline in seconds (createPoints timeout)
grpc.write.deadline.seconds=3

# Connection status cache duration in milliseconds
# Controls how often the gateway polls the gRPC connection for status
status.cache.ms=30000

# Measurement cache refresh interval in seconds
# Periodically syncs the local measurement cache with Factry to detect
# deleted measurements and allow re-creation on the next store
measurement.cache.refresh.seconds=30

# Page size for fetching measurements from Factry during cache refresh
# Larger values reduce the number of gRPC round-trips but increase per-request payload
measurement.cache.page.size=5000

# gRPC read deadline in seconds: history queries and each page of the measurement cache refresh
grpc.read.deadline.seconds=30

# gRPC deadline in seconds for the small calls: collectors, assets, health and collector state
grpc.call.deadline.seconds=10

# How long a settings save or shutdown waits for running gRPC calls before it cancels them
grpc.shutdown.grace.seconds=3

# A write gets grpc.write.deadline.seconds plus this many milliseconds per point, so a full
# store and forward batch on a slow link gets more time than a single point
grpc.write.deadline.ms.per.point=1

# Ceiling on the write deadline in seconds, whatever the batch size
grpc.write.deadline.max.seconds=30

# Send writes gzip-compressed: about 6 times fewer bytes on a slow link. Factry v8.2.3
# accepts it. If an older Factry refuses writes with UNIMPLEMENTED, set this to false.
grpc.write.gzip=true
