# Test copy of src/main/resources/factry-historian.properties. It comes first on the test
# classpath, so ModuleProperties reads this one. Time limits are short so tests that run
# against a Factry that never answers finish in seconds.

grpc.write.deadline.seconds=1
grpc.read.deadline.seconds=6
grpc.call.deadline.seconds=1
grpc.shutdown.grace.seconds=1

status.cache.ms=30000
measurement.cache.refresh.seconds=30
measurement.cache.page.size=5000
