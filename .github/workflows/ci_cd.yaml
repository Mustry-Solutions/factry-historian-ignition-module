name: CI
run-name: Test and build by ${{ github.actor }}

# Factry publishes the signed releases. This fork only tests and builds an
# unsigned module, so no job needs a secret or write access.
on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  # The job ids are the status check names the main ruleset requires: keep
  # them as `test` and `build`, and don't add paths filters, or a PR that
  # skips the run never gets its required checks.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run unit tests
        run: ./gradlew test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # The test job already ran the tests.
      - name: Build unsigned Ignition module
        run: ./gradlew clean build -x test -PskipSigning=true

      - name: Upload module artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ignition-module
          path: build/Factry-Historian.unsigned.modl
          if-no-files-found: error
          retention-days: 7
